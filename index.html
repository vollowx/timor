    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8faf0" />
    <meta name="description" content="Timor - a clock, stopwatch and timer." />
    <title>Timor</title>
    <link rel="icon" type="image/svg+xml" href="/timor/assets/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght,ROND@6..144,1..1000,0..100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/timor/assets/index.css" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem("timor.theme") || "auto";
          const prefersDark = matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          document.documentElement.dataset.mdColorScheme =
            theme === "auto" ? (prefersDark ? "dark" : "light") : theme;
        } catch {}
      })();
    </script>

    <!--lit-part dsVMIJkqkiE=--><timor-app><template shadowroot="open" shadowrootmode="open"><style>
    :host {
      display: flex;
      height: 100dvh;
    }

    main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background-color: var(--md-sys-color-surface-container);
    }

    .page {
      flex: 1;
      display: flex;
      background-color: var(--md-sys-color-background);
      border-radius: 28px;
      margin-block: 16px;
      margin-inline-end: 16px;
      overflow: hidden;
    }

    ::view-transition-old(*) {
      animation: vt-out 500ms linear forwards;
    }

    ::view-transition-new(*) {
      animation: vt-in 500ms linear;
    }

    @keyframes vt-out {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      5% {
        opacity: 1;
        transform: translateY(-0.7px);
      }
      10% {
        opacity: 1;
        transform: translateY(-2.9px);
      }
      15% {
        opacity: 1;
        transform: translateY(-8.4px);
      }
      20% {
        opacity: 0;
        transform: translateY(-19.3px);
      }
      100% {
        opacity: 0;
        transform: translateY(-30px);
      }
    }

    @keyframes vt-in {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      5% {
        opacity: 0;
        transform: translateY(29.3px);
      }
      10% {
        opacity: 0;
        transform: translateY(27.1px);
      }
      15% {
        opacity: 0;
        transform: translateY(21.6px);
      }
      20% {
        opacity: 0.837;
        transform: translateY(10.7px);
      }
      25% {
        opacity: 1;
        transform: translateY(6.7px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
